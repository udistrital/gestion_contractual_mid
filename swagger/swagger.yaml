openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_healthCheck
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /amparos-contratos/{contratoId}:
    get:
      operationId: AmparosContratosController_getAmparosByContratoId
      parameters:
        - name: contratoId
          required: true
          in: path
          description: ID del contrato
          schema:
            type: number
      responses:
        '200':
          description: Amparos encontrados con éxito
        '400':
          description: contratoId no es un entero
        '404':
          description: Amparos no encontrados
      summary: Obtener amparos por ID de contrato
      tags:
        - amparos-contratos
  /cargue-masivo/especificaciones-tecnicas:
    post:
      operationId: CargueMasivoController_cargueMasivo
      parameters: []
      responses:
        '201':
          description: ''
      tags:
        - CargueMasivo
  /contratos-generales/{id}:
    get:
      operationId: ContratoGeneralController_consultarInfoContrato
      parameters:
        - name: ids
          required: false
          in: query
          description: Mostrar la información con sus respectivos ids
          schema:
            default: false
            type: boolean
        - name: id
          required: true
          in: path
          description: ID del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Retorna detalle de un contrato-general.
        '400':
          description: Error en la solicitud.
      summary: Retorna información de contrato-general por ID.
      tags: &ref_0
        - ContratoGeneral
  /contratos-generales:
    get:
      operationId: ContratoGeneralController_consultarContratos
      parameters:
        - name: sortBy
          required: false
          in: query
          description: Campo por el cual ordenar
          schema:
            type: string
        - name: orderBy
          required: false
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum:
              - ASC
              - DESC
        - name: limit
          required: false
          in: query
          description: Número de registros a retornar
          schema:
            minimum: 0
            type: number
        - name: offset
          required: false
          in: query
          description: Número de registros a saltar
          schema:
            minimum: 0
            type: number
        - name: queryFilter
          required: false
          in: query
          description: Filtros aplicados para el crud
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos generales
      summary: Retorna información de contratos generales con filtros y paginación
      tags: *ref_0
  /contratos-generales/consecutivo:
    post:
      operationId: ContratoGeneralController_generarConsecutivo
      parameters: []
      responses:
        '200':
          description: Consecutivo del contrato generado exitosamente
        '500':
          description: Error interno del servidor
      summary: Generación de consecutivo del contrato
      tags: *ref_0
  /contratos-generales/numero-contrato:
    post:
      operationId: ContratoGeneralController_generarNumeroContrato
      parameters: []
      responses:
        '200':
          description: Número de contrato generado exitosamente
        '500':
          description: Error interno del servidor
      summary: Generación de número de contrato
      tags: *ref_0
  /contratos-generales/ids/separados:
    get:
      operationId: ContratoGeneralController_consultarContratosIdSeparados
      parameters:
        - name: sortBy
          required: false
          in: query
          description: Campo por el cual ordenar
          schema:
            type: string
        - name: orderBy
          required: false
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum:
              - ASC
              - DESC
        - name: limit
          required: false
          in: query
          description: Número de registros a retornar
          schema:
            minimum: 0
            type: number
        - name: offset
          required: false
          in: query
          description: Número de registros a saltar
          schema:
            minimum: 0
            type: number
        - name: queryFilter
          required: false
          in: query
          description: Filtros aplicados para el crud
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos generales con IDs y valores descriptivos
      summary: >-
        Retorna información de contratos generales manteniendo los IDs
        originales
      tags: *ref_0
  /espacios-fisicos/sedes:
    get:
      description: Obtiene todas las sedes activas del sistema
      operationId: EspaciosFisicosController_obtenerSedes
      parameters: []
      responses:
        '200':
          description: Lista de sedes obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      Success:
                        type: boolean
                        example: true
                      Status:
                        type: number
                        example: 200
                      Message:
                        type: string
                        example: Sedes obtenidas exitosamente
                      Data:
                        type: array
                        items:
                          properties:
                            Id:
                              type: number
                              example: 1
                            Nombre:
                              type: string
                              example: Sede Principal
        '404':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  Success:
                    type: boolean
                    example: false
                  Status:
                    type: number
                    example: 404
                  Message:
                    type: string
                    example: No se encontraron sedes activas
      summary: Obtener sedes
      tags: &ref_1
        - Espacios Físicos
  /espacios-fisicos/dependencias-sede/{id}:
    get:
      description: Obtiene todas las dependencias asociadas a una sede específica
      operationId: EspaciosFisicosController_obtenerDependencias
      parameters:
        - name: id
          required: true
          in: path
          description: Identificador de la sede
          schema:
            type: string
      responses:
        '200':
          description: Lista de dependencias obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      Success:
                        type: boolean
                        example: true
                      Status:
                        type: number
                        example: 200
                      Message:
                        type: string
                        example: Dependencias obtenidas exitosamente
                      Data:
                        type: array
                        items:
                          properties:
                            id:
                              type: number
                              example: 1
                            nombre:
                              type: string
                              example: Facultad de Ingeniería
        '404':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  Success:
                    type: boolean
                    example: false
                  Status:
                    type: number
                    example: 404
                  Message:
                    type: string
                    example: No se encontraron dependencias
      summary: Obtener dependencias por sede
      tags: *ref_1
  /estados:
    get:
      operationId: EstadosController_consultarContratos
      parameters:
        - name: sortBy
          required: false
          in: query
          description: Campo por el cual ordenar
          schema:
            type: string
        - name: orderBy
          required: false
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum:
              - ASC
              - DESC
        - name: limit
          required: false
          in: query
          description: Número de registros a retornar
          schema:
            minimum: 0
            type: number
        - name: offset
          required: false
          in: query
          description: Número de registros a saltar
          schema:
            minimum: 0
            type: number
        - name: queryFilter
          required: false
          in: query
          description: Filtros aplicados para el crud
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos generales
      summary: Retorna información sobre el estado de los contratos
      tags:
        - Estados
  /variables-clausulas:
    get:
      operationId: VariablesClausulasController_encontrarContratista
      parameters:
        - name: id
          required: true
          in: query
          schema:
            type: string
        - name: doc
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Contrato encontrado exitosamente
        '400':
          description: Solicitud incorrecta
        '404':
          description: Contrato no encontrado
        '500':
          description: Error interno del servidor
      summary: Consulta las variables del Contrato para las clausulas
      tags:
        - VariablesClausulas
  /ordenadores/contrato/{id}:
    get:
      operationId: OrdenadoresController_consultarInfoOrdenador
      parameters:
        - name: id
          required: true
          in: path
          description: ID del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Retorna detalle de un supervisor.
        '400':
          description: Error en la solicitud.
      summary: Retorna información de Supervisor por ID de contrato.
      tags:
        - Ordenadores
  /supervisores/contrato/{id}:
    get:
      operationId: SupervisoresController_consultarInfoSupervisor
      parameters:
        - name: id
          required: true
          in: path
          description: ID del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Retorna detalle de un supervisor.
        '400':
          description: Error en la solicitud.
      summary: Retorna información de Supervisor por ID de contrato.
      tags:
        - Supervisores
  /polizas:
    get:
      operationId: PolizasController_consultar
      parameters:
        - name: include
          required: false
          in: query
          schema: {}
        - name: fields
          required: false
          in: query
          schema: {}
        - name: orderBy
          required: false
          in: query
          schema:
            enum:
              - ASC
              - DESC
            type: string
        - name: sortBy
          required: false
          in: query
          schema: {}
        - name: offset
          required: false
          in: query
          schema: {}
        - name: limit
          required: false
          in: query
          schema: {}
        - name: query
          required: false
          in: query
          description: Filtro JSON, ej. {"contrato_general_id":1,"activo":true}
          schema: {}
      responses:
        '200':
          description: Pólizas encontradas
        '400':
          description: Parámetros inválidos (CRUD)
      summary: Consultar pólizas (reenvía a gestion_contractual_crud)
      tags: &ref_2
        - polizas
    post:
      operationId: PolizasController_crear
      parameters: []
      requestBody:
        required: true
        description: Mismo body que POST /polizas del CRUD (CrearPolizaDto)
        content:
          application/json:
            schema:
              type: string
      responses:
        '201':
          description: Póliza creada
        '400':
          description: Body inválido (CRUD)
        '404':
          description: Contrato no encontrado (CRUD)
      summary: Crear póliza (reenvía a gestion_contractual_crud)
      tags: *ref_2
  /polizas/{id}:
    put:
      operationId: PolizasController_actualizar
      parameters:
        - name: id
          required: true
          in: path
          description: ID de la póliza
          schema:
            type: number
      requestBody:
        required: true
        description: Mismo body que PUT /polizas/:id del CRUD (parcial)
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Póliza actualizada
        '400':
          description: id no entero o body inválido
        '404':
          description: Póliza no encontrada (CRUD)
      summary: Actualizar póliza (reenvía a gestion_contractual_crud)
      tags: *ref_2
  /amparos-polizas:
    get:
      operationId: AmparosPolizasController_consultar
      parameters:
        - name: include
          required: false
          in: query
          schema: {}
        - name: fields
          required: false
          in: query
          schema: {}
        - name: orderBy
          required: false
          in: query
          schema:
            enum:
              - ASC
              - DESC
            type: string
        - name: sortBy
          required: false
          in: query
          schema: {}
        - name: offset
          required: false
          in: query
          schema: {}
        - name: limit
          required: false
          in: query
          schema: {}
        - name: query
          required: false
          in: query
          description: Filtro JSON, ej. {"contrato_general_id":1,"activo":true}
          schema: {}
      responses:
        '200':
          description: Amparos encontrados
        '400':
          description: Parámetros inválidos (CRUD)
      summary: Consultar amparos de pólizas (reenvía a gestion_contractual_crud)
      tags: &ref_3
        - amparos-polizas
    post:
      operationId: AmparosPolizasController_crear
      parameters: []
      requestBody:
        required: true
        description: >-
          Arreglo con el mismo formato que POST /amparos-polizas del CRUD
          (CrearAmparoPolizaDto[])
        content:
          application/json:
            schema:
              type: string
      responses:
        '201':
          description: Todos los amparos creados
        '206':
          description: 'Creación parcial: Data = { creados, errores }'
        '400':
          description: Body inválido (CRUD)
      summary: Crear amparos en lote (reenvía a gestion_contractual_crud)
      tags: *ref_3
  /amparos-polizas/{id}:
    put:
      operationId: AmparosPolizasController_actualizar
      parameters:
        - name: id
          required: true
          in: path
          description: ID del amparo
          schema:
            type: number
      requestBody:
        required: true
        description: Mismo body que PUT /amparos-polizas/:id del CRUD (parcial)
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Amparo actualizado
        '400':
          description: id no entero o body inválido
        '404':
          description: Amparo no encontrado (CRUD)
      summary: >-
        Actualizar amparo o vincularlo a una póliza (reenvía a
        gestion_contractual_crud)
      tags: *ref_3
    delete:
      operationId: AmparosPolizasController_eliminar
      parameters:
        - name: id
          required: true
          in: path
          description: ID del amparo
          schema:
            type: number
      responses:
        '200':
          description: Amparo eliminado (activo=false)
        '400':
          description: id no entero
        '404':
          description: Amparo no encontrado (CRUD)
      summary: Eliminar amparo, borrado lógico (reenvía a gestion_contractual_crud)
      tags: *ref_3
info:
  title: Gestion Contractual API MID
  description: API
  version: 1.0.0
  contact: {}
tags:
  - name: API
    description: ''
servers: []
components:
  schemas: {}
